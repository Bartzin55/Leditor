[package]
name = "leditor"
version = "1.5.0"
license = "MIT"
edition = "2021"
rust-version = "1.88"
description = "A minimal, offline GTK text editor"

[dependencies]
sourceview5 = "0.10"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true



[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }
